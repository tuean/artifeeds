[workspace]
resolver = "3"
members = ["crates/artifeeds-core", "crates/artifeeds-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tuean/artifeeds"
description = "High-throughput, low-footprint RSS/Atom/JSON-Feed desktop reader built on Rust + GPUI"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1.9"
feed-rs = "2.3"
flume = "0.11"
notify = "8"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "zstd",
    "http2",
    "charset",
    "stream",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustc-hash = "2"
seahash = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
futures = "0.3"

artifeeds-core = { path = "crates/artifeeds-core" }

# Release: favour runtime speed + small binary over compile time.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
incremental = false

# Dev: keep dependencies optimised so the UI stays smooth while iterating.
[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2
